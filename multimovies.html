<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG TV MultiMovies Remote Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* Top Navigation Bar */
        #tv-header {
            height: 50px;
            background: #111;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            border-bottom: 2px solid #333;
        }

        .tv-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Remote Focus Highlight Effect */
        .tv-btn:focus {
            border: 3px solid #58a6ff !important;
            box-shadow: 0 0 10px #58a6ff !important;
            background: #333 !important;
            outline: none;
        }

        /* Fullsite Viewport */
        #site-frame {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }
    </style>
</head>
<body>

    <div id="tv-header">
        <button class="tv-btn" tabindex="1" onclick="reloadSite()">🔄 Refresh</button>
        <button class="tv-btn" tabindex="2" onclick="activateRemoteMode()">🎮 Activate TV Remote Controls</button>
        <span style="color: #888; font-size: 13px;">(Remote ke Arrow Keys se navigation chalao)</span>
    </div>

    <!-- MultiMovies Loaded Frame -->
    <iframe id="site-frame" src="https://m1.multimovies.courses/"></iframe>

    <script>
        function reloadSite() {
            document.getElementById('site-frame').src = 'https://m1.multimovies.courses/';
        }

        // Script to Inject Arrow Key Controls directly into the website
        function activateRemoteMode() {
            try {
                const iframe = document.getElementById('site-frame').contentWindow.document;
                
                // Add Focus CSS Style inside site
                let style = iframe.createElement('style');
                style.innerHTML = `
                    a:focus, button:focus, .movie-card:focus, .item:focus, [tabindex]:focus, img:focus {
                        border: 4px solid #58a6ff !important;
                        box-shadow: 0 0 15px #58a6ff !important;
                        transform: scale(1.05) !important;
                        outline: none !important;
                    }
                `;
                iframe.head.appendChild(style);

                // Make elements selectable by arrow keys
                const items = iframe.querySelectorAll('a, button, .movie-card, .poster, img');
                items.forEach((el) => {
                    el.setAttribute('tabindex', '0');
                });

                alert("TV Remote Activated! Ab aap Remote ke Arrow Keys se Website scroll kar sakte hain.");
            } catch (e) {
                alert("Site Load hone ke baad button dabayein!");
            }
        }
    </script>
</body>
</html>
