<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG TV Custom Movie Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(180deg, #161b22 0%, #0b0e14 100%);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #21262d;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #58a6ff;
            letter-spacing: 1px;
        }

        .tv-badge {
            background-color: #238636;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .url-bar-container {
            padding: 20px 40px;
            display: flex;
            gap: 15px;
        }

        .tv-input {
            flex: 1;
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 10px;
            padding: 15px 20px;
            color: #fff;
            font-size: 18px;
            outline: none;
            transition: all 0.2s ease;
        }

        .tv-button {
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* High Visibility Focus Style for TV Remote Navigation */
        .focusable:focus,
        .tv-input:focus,
        .tv-button:focus {
            border: 4px solid #58a6ff !important;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.8) !important;
            transform: scale(1.03);
            outline: none;
            background-color: #1f242d !important;
        }

        .main-content {
            flex: 1;
            padding: 20px 40px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            color: #8b949e;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 160px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .card-sub {
            font-size: 14px;
            color: #8b949e;
        }

        /* Fullscreen Player Container */
        #player-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-hint {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10000;
            color: #aaa;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📺 LG TV Stream Control</div>
        <div class="tv-badge">Remote Ready (D-Pad)</div>
    </header>

    <div class="url-bar-container">
        <input type="text" id="target-url" class="tv-input focusable" value="https://m1.multimovies.courses/" placeholder="Website URL enter karein...">
        <button id="load-btn" class="tv-button focusable" onclick="loadSite()">OPEN SITE</button>
    </div>

    <div class="main-content">
        <div class="section-title">Quick Navigation Shortcuts</div>
        <div class="grid-container" id="card-grid">
            <div class="card focusable" tabindex="0" onclick="openDirect('https://m1.multimovies.courses/')">
                <div class="card-title">MultiMovies Home</div>
                <div class="card-sub">Ad-free view interface</div>
            </div>
            <div class="card focusable" tabindex="0" onclick="openDirect('https://m1.multimovies.courses/category/movies/')">
                <div class="card-title">Latest Movies</div>
                <div class="card-sub">Browse Movies Category</div>
            </div>
            <div class="card focusable" tabindex="0" onclick="openDirect('https://m1.multimovies.courses/category/web-series/')">
                <div class="card-title">Web Series</div>
                <div class="card-sub">Browse Series Category</div>
            </div>
        </div>
    </div>

    <!-- Video Embed / Clean Frame -->
    <div id="player-overlay">
        <div class="back-hint">Press <b>BACK / ESC</b> on remote to exit</div>
        <iframe id="site-frame" src="about:blank"></iframe>
    </div>

    <script>
        // TV Remote Navigation logic (D-Pad Control)
        let focusableElements = [];
        let currentIndex = 0;

        function updateFocusables() {
            focusableElements = Array.from(document.querySelectorAll('.focusable'));
        }

        function setFocus(index) {
            if (focusableElements.length === 0) return;
            if (index < 0) index = 0;
            if (index >= focusableElements.length) index = focusableElements.length - 1;
            
            currentIndex = index;
            focusableElements[currentIndex].focus();
        }

        // Handle LG Remote Keys (Arrow Keys, Enter, Back)
        document.addEventListener('keydown', function(e) {
            updateFocusables();
            
            const overlay = document.getElementById('player-overlay');
            
            // Exit player on Backspace / Escape key
            if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 461) { // 461 is LG TV Back Key Code
                if (overlay.style.display === 'block') {
                    overlay.style.display = 'none';
                    document.getElementById('site-frame').src = 'about:blank';
                    e.preventDefault();
                    setFocus(0);
                    return;
                }
            }

            if (overlay.style.display === 'block') return; // Don't navigate grid when watching

            switch (e.key) {
                case 'ArrowRight':
                    if (currentIndex < focusableElements.length - 1) setFocus(currentIndex + 1);
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (currentIndex > 0) setFocus(currentIndex - 1);
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    // Grid navigation - Jump row down
                    if (currentIndex + 3 < focusableElements.length) {
                        setFocus(currentIndex + 3);
                    } else if (currentIndex < focusableElements.length - 1) {
                        setFocus(focusableElements.length - 1);
                    }
                    e.preventDefault();
                    break;
                case 'ArrowUp':
                    // Grid navigation - Jump row up
                    if (currentIndex - 3 >= 0) {
                        setFocus(currentIndex - 3);
                    } else {
                        setFocus(0);
                    }
                    e.preventDefault();
                    break;
                case 'Enter':
                    document.activeElement.click();
                    e.preventDefault();
                    break;
            }
        });

        function loadSite() {
            const url = document.getElementById('target-url').value;
            openDirect(url);
        }

        function openDirect(url) {
            const overlay = document.getElementById('player-overlay');
            const frame = document.getElementById('site-frame');
            frame.src = url;
            overlay.style.display = 'block';
        }

        // Initial setup
        window.onload = () => {
            updateFocusables();
            setFocus(0);
        };
    </script>
</body>
</html>
